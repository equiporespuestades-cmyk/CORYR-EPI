
name: Compilar CORYR EPI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar SDK Android 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: CORYR-EPI-8.3-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
